<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="app">
    <input type="text" id="password-output" value="Générateur de MDP" name="password-output" readonly>

    <div class="range-container">
      <input type="range" id="password-length" name="password-length" min="4" max="24" value="4">
      <input type="text" id="display-password-length" name="display-password-length" value="8" readonly>
    </div>

    <div class="checkbox-container">
      <input type="checkbox" id="lowercase" name="lowercase" class="cells" checked>
      <label for="lowercase">a-z</label>

      <input type="checkbox" id="uppercase" name="uppercase" class="cells">
      <label for="uppercase">A-Z</label>

      <input type="checkbox" id="numbers" name=numbers class="cells">
      <label for="numbers">0-9</label>

      <input type="checkbox" id="symbols" name="symbols" class="cells">
      <label for="symbols">!-?</label>
    </div>

    <button id="generateButton">Générer mot de passe</button>
  </div>
  <script src="app.js"></script>
</body>

</html>
