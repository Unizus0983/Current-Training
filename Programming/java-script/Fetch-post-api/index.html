<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="création API et récupèration de données">
    <title>création API et récupèration de données</title>
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <section class="container_form">
        <h1>formulaire</h1>
        <form id="formulaire">
            <input type="text" name="prenom" id="prenom" placeholder="Votre prénom" required>
            <input type="text" name="fullname" id="fullname" placeholder="Votre nom de famille" required>
            <input type="email" name="mail" id="mail" placeholder="contact@gmail.com" required>
            <input type="tel" id="phone" name="phone" placeholder="00-00-00-00-00"
                pattern="[0-9]{2} [0-9]{2} [0-9]{2} [0-9]{2} [0-9]{2}" required>

            <input type="submit" value="Envoyer">

        </form>

    </section>
    <script src="./app-1.js"></script>
</body>

</html>
